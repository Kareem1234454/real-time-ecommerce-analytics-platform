apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: PostgreSQL_Metadata
    type: postgres
    access: proxy
    url: postgres:5432
    user: admin
    database: ecommerce_meta
    secureJsonData:
      password: admin123
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    editable: true
